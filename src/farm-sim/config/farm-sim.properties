# F9/F116 - Runtime configuration for the Java farm simulator.
# Defines gateway movement, backend timeouts, durable storage, retry, alert and sensor-node policies.
# Relative paths are resolved from paths.base-dir. This file contains no secrets.
paths.base-dir=..

gateway.id=UAV-GW-01
gateway.speed-mps=5
gateway.altitude-m=30
gateway.radio-range-m=40
gateway.waypoints=20,30;180,30;180,90;20,90;0,0

backend.ingest-url=http://localhost:8080/api/ingest
backend.connect-timeout-ms=2000
backend.request-timeout-ms=5000

storage.queue-file=data/gateway-buffer.jsonl
storage.dead-letter-file=data/gateway-dead-letter.jsonl
storage.capacity=5000

# Generated HMAC keys are kept in this runtime file (data/ is gitignored).
security.key-file=data/node-keys.properties

radio.packet-loss-rate=0.10
radio.random-seed=42

retry.initial-delay-ms=2000
retry.max-delay-ms=120000
retry.multiplier=2.0
retry.jitter-ratio=0.20

nodes.ids=NODE-001,NODE-002,NODE-003,NODE-004,NODE-005,NODE-006
node.NODE-001.model=ESP32-SIM
node.NODE-001.firmware=1.0.0
node.NODE-001.farm-id=FARM-01
node.NODE-001.x=40
node.NODE-001.y=30
node.NODE-001.simulation-seed=101

node.NODE-002.model=ESP32-SIM
node.NODE-002.firmware=1.0.0
node.NODE-002.farm-id=FARM-01
node.NODE-002.x=100
node.NODE-002.y=30
